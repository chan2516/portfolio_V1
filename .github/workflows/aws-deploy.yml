name: Build and deploy Docker image

on:
  push:
    branches:
      - main

env:
  DEPLOY_DIR: /opt/portfolio

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, publish, and deploy
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Validate release
      run: |
        npm ci
        npm run lint
        npm test
        npm run build

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push image
      env:
        IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio
      run: |
        docker build --pull \
          --tag "$IMAGE_NAME:${{ github.sha }}" \
          --tag "$IMAGE_NAME:latest" .
        docker volume create portfolio-ci-data
        docker run --rm --user 0:0 -v portfolio-ci-data:/data "$IMAGE_NAME:${{ github.sha }}" node server/prepare-storage.js
        docker run -d --name portfolio-ci -v portfolio-ci-data:/data "$IMAGE_NAME:${{ github.sha }}"
        ready=false
        for attempt in $(seq 1 90); do
          state=$(docker inspect --format '{{.State.Health.Status}}' portfolio-ci)
          running=$(docker inspect --format '{{.State.Running}}' portfolio-ci)
          if [ "$running" != true ]; then break; fi
          if [ "$state" = healthy ]; then ready=true; break; fi
          if [ "$state" = unhealthy ]; then break; fi
          sleep 2
        done
        if [ "$ready" != true ]; then
          docker logs portfolio-ci
          docker inspect --format '{{json .State}}' portfolio-ci
          exit 1
        fi
        docker rm -f portfolio-ci
        docker volume rm portfolio-ci-data
        docker push "$IMAGE_NAME:${{ github.sha }}"
        docker push "$IMAGE_NAME:latest"

    - name: Configure SSH
      run: |
        sudo apt-get update
        sudo apt-get install -y sshpass

    - name: Copy deployment configuration over SSH
      env:
        SSHPASS: ${{ secrets.SERVER_PASS }}
      run: |
        tar -czf - docker-compose.prod.yml Caddyfile scripts/deploy.sh | sshpass -e ssh \
          -o StrictHostKeyChecking=accept-new \
          -o PreferredAuthentications=password \
          -o PubkeyAuthentication=no \
          "${{ secrets.SERVER_USER }}@${{ secrets.IP }}" \
          "set -eu; mkdir -p '$DEPLOY_DIR'; tar -xzf - -C '$DEPLOY_DIR' && mv '$DEPLOY_DIR/docker-compose.prod.yml' '$DEPLOY_DIR/docker-compose.yml'"

    - name: Pull image and restart container
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        SSHPASS: ${{ secrets.SERVER_PASS }}
      run: |
        printf '%s' "$DOCKERHUB_TOKEN" | sshpass -e ssh \
          -o StrictHostKeyChecking=accept-new \
          -o PreferredAuthentications=password \
          -o PubkeyAuthentication=no \
          "${{ secrets.SERVER_USER }}@${{ secrets.IP }}" \
          "set -eu; export IMAGE_TAG='${{ github.sha }}' DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME'; cd '$DEPLOY_DIR'; docker login --username \"\$DOCKERHUB_USERNAME\" --password-stdin; sh scripts/deploy.sh"

    - name: Verify public HTTPS routing
      run: |
        curl --fail --show-error --silent --retry 8 --retry-all-errors --retry-delay 5 --max-time 15 https://chandandev.me/api/health
        curl --fail --show-error --silent --retry 3 --retry-all-errors --retry-delay 5 --max-time 15 --output /dev/null https://chandandev.me/

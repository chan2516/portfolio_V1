name: Build and deploy Docker image

on:
  push:
    branches:
      - main

env:
  DEPLOY_DIR: /opt/portfolio

jobs:
  deploy:
    name: Build, publish, and deploy
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push image
      env:
        IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio
      run: |
        docker build --pull \
          --tag "$IMAGE_NAME:${{ github.sha }}" \
          --tag "$IMAGE_NAME:latest" .
        docker push "$IMAGE_NAME:${{ github.sha }}"
        docker push "$IMAGE_NAME:latest"

    - name: Configure SSH
      run: |
        sudo apt-get update
        sudo apt-get install -y sshpass

    - name: Copy deployment configuration over SSH
      env:
        SSHPASS: ${{ secrets.SERVER_PASS }}
      run: |
        tar -czf - docker-compose.prod.yml | sshpass -e ssh \
          -o StrictHostKeyChecking=accept-new \
          -o PreferredAuthentications=password \
          -o PubkeyAuthentication=no \
          "${{ secrets.SERVER_USER }}@${{ secrets.IP }}" \
          "tar -xzf - -C '$DEPLOY_DIR' && mv '$DEPLOY_DIR/docker-compose.prod.yml' '$DEPLOY_DIR/docker-compose.yml'"

    - name: Pull image and restart container
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        SSHPASS: ${{ secrets.SERVER_PASS }}
      run: |
        printf '%s' "$DOCKERHUB_TOKEN" | sshpass -e ssh \
          -o StrictHostKeyChecking=accept-new \
          -o PreferredAuthentications=password \
          -o PubkeyAuthentication=no \
          "${{ secrets.SERVER_USER }}@${{ secrets.IP }}" \
          "export IMAGE_TAG='${{ github.sha }}' DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME'; cd '$DEPLOY_DIR'; docker login --username \"\$DOCKERHUB_USERNAME\" --password-stdin; docker compose pull; docker compose up -d --remove-orphans; docker image prune -f"
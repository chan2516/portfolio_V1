services:
  storage-init:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/portfolio:${IMAGE_TAG:?Set IMAGE_TAG}
    user: "0:0"
    restart: "no"
    command: ["node", "server/prepare-storage.js"]
    volumes:
      - portfolio_data:/data
  portfolio:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/portfolio:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: portfolio
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_STORAGE: /data/database.sqlite
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY_HOPS: 1
    expose:
      - "5000"
    volumes:
      - portfolio_data:/data
  caddy:
    image: caddy:2-alpine
    container_name: portfolio-caddy
    restart: unless-stopped
    depends_on:
      portfolio:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  portfolio_data:
  caddy_data:
  caddy_config:
